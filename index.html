<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading...</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css?v=1793909889">

    <!-- Syntax Highlighting (Prism) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ruby.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-toml.min.js"></script>

    <!-- Primary Meta Tags -->
    <meta name="title" content="neovim-web">
    <meta name="description" content="Mauro Milella's website, inspired by neovim and gruvbox theme.">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="milella-mauro">
    <meta property="og:description"
          content="Mauro Milella's website, inspired by neovim and gruvbox theme.">
    <meta property="og:image" content="images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="neovim-web">
    <meta name="twitter:description"
          content="Mauro Milella's website, inspired by neovim and gruvbox theme.">
    <meta name="twitter:image" content="images/og-image.png">

    <meta name="google" content="notranslate" />
</head>

<!-- TODO: I currently decided to forcibly tru to stop any translation;
    to enable them, change the html 'translate' attribute, the 
    <meta name="google"... /> tag, and the content="notranslate" below --!>
<body content="notranslate">

    <div class="scanlines"></div>

    <div class="app-container">
        <!-- Buffer Tabs & Top Widgets -->

        <!-- 
            Kept for compatibility with the original project, 
            because updateUI in engine.js references the tab-container here.
            If you don't like to mimic an 'opened file' tab,
            set .buffer-bar { display: none;} in the CSS 
        -->
        <div class="buffer-bar glow-text">
            <div id="tab-container" class="tabs-left"></div>
            <div class="tab-overflow-btn" id="tab-overflow-btn" onclick="toggleTabOverflow()"></div>
            <div class="widgets-right">
                <div class="widget widget-green" id="telescope-widget" style="cursor:pointer;"
                    onclick="openTelescope()"><i class="fas fa-search"></i></div>
                <!-- <div class="widget widget-blue"><i class="fas fa-wifi"></i> ONLINE</div>  -->
                <!-- <div class="widget widget-purple"><i class="fas fa-clock"></i> <span id="clock-widget"></span></div> -->
            </div>
        </div>

        <div class="workspace">
            <!-- Sidebar -->
            <div class="nvim-tree" id="nvim-tree">
                <div class="tree-hint" onclick="openTelescope()"><i class="fas fa-search"></i> Search <span
                        class="tree-hint-key">/</span></div>
                <div style="height: 10px;"></div>

                <div class="tree-header" style="border-top: 1px solid var(--border); padding-top:10px;">Navigation</div>
                <div class="file-node" onclick="goHome()"><i class="fas fa-home" style="color: var(--yellow)"></i> Home</div>
                <div style="height: 10px;"></div>

                <div class="tree-header"><i class="fas fa-project-diagram"></i> Explorer</div>
                <div id="file-list-container"></div>

                <div id="mobile-cmd-wrapper">
                    <span style="color: var(--green); margin-right: 8px;">&#10095;</span>
                    <input type="text" id="mobile-cmd-input" placeholder="Enter cmd..." autocomplete="off"
                        autocapitalize="off" spellcheck="false">
                    <button id="mobile-cmd-btn">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <div class="tree-header" style="margin-top:auto; border-top: none; padding-top:10px;">Links</div>
                <div id="link-list-container"></div>
                <div style="height: 10px;"></div>
            </div>

            <!-- Editor -->
            <div class="editor-container">
                <div class="content-scroll" id="scroll-container" tabindex="0">
                    <div id="markdown-output" class="markdown-body glow-text"></div>
                    <br><br>
                    <div style="color: var(--comment)">~</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="status-line">
            <div style="display:flex; height:100%">
                <!-- Mode -->
                <div class="segment mode-normal" id="mode-segment">NORMAL</div>

                <!-- Git -->
                <!-- <div class="segment seg-dark" id="git-branch" style="cursor: pointer;"> -->
                <!--     <i class="fas fa-code-branch" style="font-size: 10px;"></i> main -->
                <!-- </div> -->

                <!-- Theme switcher -->
                <!-- Minor TODO: the cursor transition now applies to segments, 
                independently from the id -->
                <div class="segment seg-dark" id="theme-switch" role="button"
                    style="border-left: 1px solid var(--border);">
                    <i class="fas fa-palette" style="font-size: 10px;"></i>
                    <span id="theme-name"></span>
                </div>

                <!-- Filename -->
                <div class="segment seg-light" id="status-filename">[No Name]</div>
            </div>

            <div style="display:flex; height:100%">
                <div class="segment seg-light">markdown</div>
                <div class="segment seg-dark" id="status-percent">TOP</div>
            </div>
        </div>


        <!-- Command Bar -->
        <div class="cmd-bar">
            <span id="cmd-display" style="color: var(--comment)">:help</span>
            <input type="text" id="cmd-input" class="cmd-input">
        </div>
    </div>
    <div class="mobile-toggle mobile-search" onclick="openTelescope()"><i class="fas fa-search"></i></div>
    <div class="mobile-toggle" onclick="toggleTree()"><i class="fas fa-bars"></i></div>

    <!-- Scripts (Load Order Matters: config → commands → alpha → engine) -->
    <script src="config.js?v=1793909889"></script>
    <script src="commands.js?v=1793909889"></script>
    <script src="alpha.js?v=1793909889"></script>
    <script src="engine.js?v=1793909889"></script>

    <!-- The cursor is just an illusion ; ) -->
    <div id="custom-cursor" aria-hidden="true">
        <svg class="cursor-ring" width="48" height="48" viewBox="-24 -24 48 48"><ellipse cx="0" cy="0" rx="16" ry="16" /></svg>
        <!-- Over clickable things: a pointing hand, with the little saturn on its fingertip -->
        <svg class="cursor-hand" width="30" height="30" viewBox="-10 -2 30 30">
            <path class="hand-body" d="M -2.5 15.6 V 2.5 A 2.5 2.5 0 0 1 2.5 2.5 V 9.5 Q 2.5 7.5 4.5 7.5 Q 6.5 7.5 6.5 9.5 Q 6.5 8.5 8.25 8.5 Q 10 8.5 10 10.5 Q 10 9.8 11.5 9.8 Q 13 9.8 13 11.8 V 16 Q 13 22 7 22 H 1.5 Q -1.5 22 -3.5 19.5 L -7.4 14.6 Q -8.4 13.2 -7.2 12.4 Q -6 11.7 -5 12.8 Z" />
        </svg>
        <svg class="cursor-ring-front" width="48" height="48" viewBox="-24 -24 48 48"><path d="" /></svg>
        <div class="cursor-ping"></div>
        <div class="cursor-dot"></div>
    </div>
    <script src="cursor.js?v=1793909889"></script>
</body>

</html>
